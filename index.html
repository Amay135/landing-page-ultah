<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kejutan Ulang Tahun</title>
  <meta name="description" content="Sebuah kejutan kecil untukmu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <!-- Favicon data URI: mencegah permintaan /favicon.ico yang 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 21C5.5 16.5 2 13.2 2 9.3 2 6.1 4.4 4 7 4c2 0 3.7 1.1 5 3.2C13.3 5.1 15 4 17 4c2.6 0 5 2.1 5 5.3 0 3.9-3.5 7.2-10 11.7Z' fill='%23F4B6C2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gate-tertutup">
  <!-- Tanpa JavaScript gate jangan sampai mengunci halaman -->
  <noscript>
    <style>#gate{display:none}body.gate-tertutup{overflow:auto}</style>
  </noscript>

  <!-- Musik: src diisi dari data.js -->
  <audio id="musik" loop preload="none"></audio>

  <!-- Tombol mute/unmute, baru tampil setelah musik mulai -->
  <button id="tombolMute" class="mute" type="button" hidden aria-pressed="false" aria-label="Matikan musik">🔊</button>

  <!-- Maskot kucing orisinal di pojok (F15). Klik: melambai. -->
  <button id="maskot" class="maskot" type="button" aria-label="Maskot kucing, klik untuk melambai">
    <svg class="maskot__svg" viewBox="0 0 80 80" aria-hidden="true" focusable="false">
      <ellipse cx="40" cy="74" rx="22" ry="4" fill="#D9BFC9" opacity=".5"/>
      <!-- Badan dan ekor -->
      <path d="M24 74c-2-16 4-27 16-27s18 11 16 27Z" fill="#FFD3B6"/>
      <path d="M62 71c8-3 10-10 6-14" fill="none" stroke="#FFD3B6" stroke-width="6" stroke-linecap="round"/>
      <!-- Kepala, telinga, dan dalam telinga -->
      <path d="M24 22 22 8l13 6Z" fill="#FFD3B6"/>
      <path d="M56 22 58 8 45 14Z" fill="#FFD3B6"/>
      <path d="M26 19l-1.5-6 6 2.6Z" fill="#F4B6C2"/>
      <path d="M54 19l1.5-6-6 2.6Z" fill="#F4B6C2"/>
      <circle cx="40" cy="32" r="19" fill="#FFD3B6"/>
      <!-- Mata, pipi, hidung, mulut, kumis -->
      <circle cx="33" cy="31" r="2.6" fill="#5A3E36"/>
      <circle cx="47" cy="31" r="2.6" fill="#5A3E36"/>
      <circle cx="28" cy="37" r="3.2" fill="#F4B6C2" opacity=".7"/>
      <circle cx="52" cy="37" r="3.2" fill="#F4B6C2" opacity=".7"/>
      <path d="M38 36h4l-2 2.4Z" fill="#E88FA0"/>
      <path d="M40 38.4c-1.4 2-4 1.6-4.6 0M40 38.4c1.4 2 4 1.6 4.6 0" fill="none" stroke="#5A3E36" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M22 33h-7M22 37l-7 2M58 33h7M58 37l7 2" stroke="#A9705C" stroke-width="1" stroke-linecap="round" opacity=".7"/>
      <!-- Tangan yang melambai saat diklik -->
      <g class="maskot__tangan">
        <path d="M54 54c7 1 10 7 8 13" fill="none" stroke="#FFD3B6" stroke-width="6" stroke-linecap="round"/>
        <circle cx="62" cy="68" r="5.2" fill="#FFD3B6"/>
        <g fill="#F4B6C2">
          <circle cx="60" cy="65" r="1.1"/>
          <circle cx="64" cy="66" r="1.1"/>
          <circle cx="62" cy="70" r="1.1"/>
        </g>
      </g>
    </svg>
  </button>

  <!-- Gate pembuka (F1) -->
  <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gateJudul">
    <p id="gateJudul" class="gate__teks"></p>
    <form id="formGate" class="gate__form" novalidate>
      <label id="labelSandi" class="gate__label" for="sandi">Kata sandi</label>
      <input id="sandi" class="input" type="password" autocomplete="off" hidden>
      <button id="tombolBuka" class="btn btn--besar" type="submit"></button>
      <p id="pesanGate" class="gate__pesan" role="status" aria-live="polite"></p>
    </form>
  </div>

  <!-- Confetti global (F3): di belakang konten, tidak menghalangi klik -->
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <!-- Sparkle saat tap/klik (F14): di atas konten, tidak menangkap klik -->
  <div id="sparkle" class="sparkle" aria-hidden="true"></div>

  <main>
    <!-- Hero (F2) -->
    <section id="hero" class="bagian hero">
      <div class="hero__dalam">
        <p id="heroAtas" class="hero__atas tulisan-tangan"></p>
        <h1 id="heroJudul" class="hero__judul">
          <span id="heroKetik" class="hero__ketik" aria-hidden="true"></span>
          <button id="heroNama" class="hero__nama" type="button" disabled></button>
        </h1>
        <p id="heroSubteks" class="hero__subteks"></p>
        <p id="heroRahasia" class="hero__rahasia tulisan-tangan" role="status" aria-live="polite" hidden></p>
        <a class="hero__panah" href="#kue" aria-label="Scroll ke bagian berikutnya">
          <span id="heroPanah"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </section>
    <!-- Kue interaktif (F4). Tiap tingkat, lilin, dan potongan adalah grup SVG
         terpisah supaya bisa dianimasikan di tahap 4B. -->
    <section id="kue" class="bagian kue">
      <!-- Latar meriah: balon, bunting, bokeh (gradien dari CSS) -->
      <svg class="kue__dekor" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
        <g fill="#FFF6EC">
          <circle cx="48" cy="430" r="34" opacity=".18"/>
          <circle cx="352" cy="150" r="26" opacity=".22"/>
          <circle cx="322" cy="530" r="44" opacity=".14"/>
          <circle cx="120" cy="580" r="22" opacity=".2"/>
          <circle cx="372" cy="452" r="16" opacity=".24"/>
          <circle cx="210" cy="64" r="12" opacity=".25"/>
          <circle cx="70" cy="132" r="16" opacity=".16"/>
          <circle cx="262" cy="360" r="9" opacity=".22"/>
        </g>

        <g class="kue__bunting">
          <path d="M-10 26Q200 82 410 26" fill="none" stroke="#5A3E36" stroke-width="2" opacity=".35"/>
          <path d="M29 39h22l-11 24Z" fill="#F4B6C2"/>
          <path d="M89 49h22l-11 24Z" fill="#FFD3B6"/>
          <path d="M149 54h22l-11 24Z" fill="#CDB4DB"/>
          <path d="M189 55h22l-11 24Z" fill="#E8B86D"/>
          <path d="M229 54h22l-11 24Z" fill="#F4B6C2"/>
          <path d="M289 49h22l-11 24Z" fill="#FFD3B6"/>
          <path d="M349 39h22l-11 24Z" fill="#CDB4DB"/>
        </g>

        <g transform="translate(90 270) rotate(-7)">
          <g class="kue__balon">
            <path d="M0 34c9 20 3 44-6 58" fill="none" stroke="#5A3E36" stroke-width="1.6" opacity=".3"/>
            <ellipse cx="0" cy="0" rx="27" ry="33" fill="#F4B6C2"/>
            <path d="M0 33l8 9h-16Z" fill="#F4B6C2"/>
            <ellipse cx="-9" cy="-11" rx="6" ry="11" fill="#FFF6EC" opacity=".5" transform="rotate(-18 -9 -11)"/>
          </g>
        </g>
        <g transform="translate(70 400) rotate(5)">
          <g class="kue__balon kue__balon--2">
            <path d="M0 28c7 16 2 34-5 46" fill="none" stroke="#5A3E36" stroke-width="1.4" opacity=".3"/>
            <ellipse cx="0" cy="0" rx="22" ry="27" fill="#CDB4DB"/>
            <path d="M0 27l7 8h-14Z" fill="#CDB4DB"/>
            <ellipse cx="-7" cy="-9" rx="5" ry="9" fill="#FFF6EC" opacity=".45" transform="rotate(-18 -7 -9)"/>
          </g>
        </g>
        <g transform="translate(320 252) rotate(8)">
          <g class="kue__balon kue__balon--3">
            <path d="M0 31c8 18 2 40-6 54" fill="none" stroke="#5A3E36" stroke-width="1.6" opacity=".3"/>
            <ellipse cx="0" cy="0" rx="25" ry="30" fill="#FFD3B6"/>
            <path d="M0 30l8 9h-16Z" fill="#FFD3B6"/>
            <ellipse cx="-8" cy="-10" rx="6" ry="10" fill="#FFF6EC" opacity=".5" transform="rotate(-18 -8 -10)"/>
          </g>
        </g>
        <g transform="translate(322 414) rotate(-6)">
          <g class="kue__balon kue__balon--4">
            <path d="M0 26c6 15 1 32-5 43" fill="none" stroke="#5A3E36" stroke-width="1.4" opacity=".3"/>
            <ellipse cx="0" cy="0" rx="20" ry="25" fill="#F4B6C2"/>
            <path d="M0 25l7 8h-14Z" fill="#F4B6C2"/>
            <ellipse cx="-6" cy="-8" rx="4.5" ry="8" fill="#FFF6EC" opacity=".45" transform="rotate(-18 -6 -8)"/>
          </g>
        </g>
      </svg>

      <div class="kue__dalam">
        <div class="kue__panggung">
          <!-- viewBox dilebarkan agar 12 piring kecil muat mengelilingi kue -->
          <svg id="kueSvg" class="kue__svg" viewBox="-88 -6 572 556" role="img" aria-label="Kue ulang tahun tiga tingkat">
            <defs>
              <linearGradient id="gradKue" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFF9F1"/>
                <stop offset=".55" stop-color="#FFEFDF"/>
                <stop offset="1" stop-color="#FFDFC9"/>
              </linearGradient>
              <linearGradient id="gradSisi" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#B07A5C" stop-opacity=".16"/>
                <stop offset=".18" stop-color="#B07A5C" stop-opacity="0"/>
                <stop offset=".78" stop-color="#B07A5C" stop-opacity="0"/>
                <stop offset="1" stop-color="#9C6647" stop-opacity=".2"/>
              </linearGradient>
              <linearGradient id="gradStand" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFFDF8"/>
                <stop offset="1" stop-color="#F3E2EC"/>
              </linearGradient>
              <linearGradient id="gradBekas" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#EFC9A0"/>
                <stop offset=".65" stop-color="#F8E0C4"/>
                <stop offset="1" stop-color="#FFF3DF"/>
              </linearGradient>
              <linearGradient id="gradPotongan" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFF8ED"/>
                <stop offset=".5" stop-color="#FBE4CE"/>
                <stop offset="1" stop-color="#F5D1AC"/>
              </linearGradient>
              <radialGradient id="gradHalo">
                <stop offset="0" stop-color="#FFDFA6" stop-opacity=".85"/>
                <stop offset="55%" stop-color="#FFC98A" stop-opacity=".3"/>
                <stop offset="100%" stop-color="#FFC98A" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="gradApi" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#FFB86B"/>
                <stop offset=".55" stop-color="#F8A94F"/>
                <stop offset="1" stop-color="#EF8A3C"/>
              </linearGradient>
              <radialGradient id="gradStroberi" cx=".35" cy=".28" r=".85">
                <stop offset="0" stop-color="#F7A9B8"/>
                <stop offset="1" stop-color="#D96C86"/>
              </radialGradient>
              <clipPath id="klipPotongan">
                <path d="M-15 -14 Q0 -20 15 -14 L23 40 Q24 48 17 48 H-17 Q-24 48 -23 40 Z"/>
              </clipPath>
              <!-- Mask memotong sisi kanan kue seiring bertambahnya porsi. -->
              <mask id="kueSisaMask" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="520">
                <rect width="400" height="520" fill="#fff"/>
                <rect id="kueSisaNotch" x="400" y="0" width="0" height="520" fill="#000"/>
              </mask>
            </defs>

            <!-- Pendar hangat di belakang kue -->
            <ellipse cx="195" cy="300" rx="185" ry="200" fill="url(#gradHalo)" opacity=".3"/>

            <!-- Cake stand dan alas piring renda -->
            <g id="kue-stand">
              <ellipse cx="195" cy="504" rx="92" ry="12" fill="#D9BFC9" opacity=".38"/>
              <ellipse cx="195" cy="497" rx="66" ry="10" fill="url(#gradStand)" stroke="#E8B86D" stroke-width="1.5"/>
              <path d="M184 451h22v40c0 7-5 11-11 11s-11-4-11-11z" fill="url(#gradStand)" stroke="#E8B86D" stroke-width="1.5"/>
              <ellipse cx="195" cy="446" rx="154" ry="25" fill="url(#gradStand)" stroke="#E8B86D" stroke-width="2"/>
              <ellipse cx="195" cy="441" rx="139" ry="19" fill="#FFFDF8"/>
              <ellipse cx="195" cy="441" rx="133" ry="16" fill="none" stroke="#FFEBD5" stroke-width="6" stroke-dasharray="0.1 12" stroke-linecap="round"/>
            </g>

            <!-- Kue utama: grup ini terkena mask, jadi menyusut tiap potongan -->
            <g id="kue-utama" mask="url(#kueSisaMask)">
            <!-- Digeser sedikit tiap potongan agar kue tetap di tengah alas -->
            <g id="kue-geser">

            <!-- Tingkat bawah -->
            <g id="kue-tingkat-bawah">
              <ellipse cx="195" cy="330" rx="140" ry="22" fill="#FBDDE2"/>
              <path d="M55 330H335V416Q335 436 315 436H75Q55 436 55 416Z" fill="url(#gradKue)" stroke="#E9C9B6" stroke-width="1.5"/>
              <path d="M55 330H335V416Q335 436 315 436H75Q55 436 55 416Z" fill="url(#gradSisi)"/>
              <ellipse cx="195" cy="330" rx="140" ry="22" fill="#FFF7EB" stroke="#E9C9B6" stroke-width="1.5"/>
              <ellipse cx="150" cy="322" rx="42" ry="6" fill="#FFFDF8" opacity=".5"/>
              <path d="M75 414H315" fill="none" stroke="#FFFDF8" stroke-width="8" stroke-dasharray="0.1 16" stroke-linecap="round"/>
              <g fill="#E8B86D">
                <rect x="98" y="356" width="8" height="3.6" rx="1.8" transform="rotate(22 102 358)"/>
                <rect x="146" y="382" width="8" height="3.6" rx="1.8" transform="rotate(-18 150 384)"/>
                <rect x="228" y="352" width="8" height="3.6" rx="1.8" transform="rotate(12 232 354)"/>
                <rect x="282" y="378" width="8" height="3.6" rx="1.8" transform="rotate(-26 286 380)"/>
                <rect x="308" y="344" width="7" height="3.2" rx="1.6" transform="rotate(18 311 346)"/>
              </g>
              <g fill="#F4B6C2">
                <rect x="120" y="388" width="7" height="3.2" rx="1.6" transform="rotate(-14 123 390)"/>
                <rect x="260" y="364" width="7" height="3.2" rx="1.6" transform="rotate(20 263 366)"/>
              </g>
            </g>

            <!-- Tingkat tengah: tulisan dari data.js -->
            <g id="kue-tingkat-tengah">
              <ellipse cx="195" cy="232" rx="107" ry="17" fill="#FBDDE2"/>
              <path d="M88 232H302V322Q302 338 286 338H104Q88 338 88 322Z" fill="url(#gradKue)" stroke="#E9C9B6" stroke-width="1.5"/>
              <path d="M88 232H302V322Q302 338 286 338H104Q88 338 88 322Z" fill="url(#gradSisi)"/>
              <ellipse cx="195" cy="232" rx="107" ry="17" fill="#FFF7EB" stroke="#E9C9B6" stroke-width="1.5"/>
              <ellipse cx="160" cy="226" rx="32" ry="5" fill="#FFFDF8" opacity=".5"/>
              <text id="kueTeks" x="195" y="292" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="20" fill="#5A3E36">Happy Birthday</text>
              <g fill="#E8B86D">
                <rect x="112" y="246" width="7" height="3.2" rx="1.6" transform="rotate(20 115 248)"/>
                <rect x="272" y="250" width="7" height="3.2" rx="1.6" transform="rotate(-16 275 252)"/>
                <rect x="150" y="312" width="7" height="3.2" rx="1.6" transform="rotate(-24 153 314)"/>
                <rect x="250" y="308" width="7" height="3.2" rx="1.6" transform="rotate(14 253 310)"/>
              </g>
              <!-- Krim menetes ke tingkat bawah -->
              <rect x="92" y="318" width="206" height="11" fill="#FFF9F0"/>
              <g fill="#FFF9F0">
                <circle cx="98" cy="328" r="7"/><circle cx="112" cy="330" r="6"/><circle cx="126" cy="328" r="7"/>
                <circle cx="140" cy="330" r="6"/><circle cx="154" cy="328" r="7"/><circle cx="168" cy="330" r="6"/>
                <circle cx="182" cy="328" r="7"/><circle cx="196" cy="330" r="6"/><circle cx="210" cy="328" r="7"/>
                <circle cx="224" cy="330" r="6"/><circle cx="238" cy="328" r="7"/><circle cx="252" cy="330" r="6"/>
                <circle cx="266" cy="328" r="7"/><circle cx="280" cy="330" r="6"/><circle cx="292" cy="328" r="7"/>
              </g>
              <path d="M96 316H294" fill="none" stroke="#F4CDD5" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
            </g>

            <!-- Tingkat atas: glaze, stroberi, dan krim. Semua sepusat di x=195
                 agar kue simetris dengan tingkat di bawahnya. -->
            <g id="kue-tingkat-atas">
              <ellipse cx="195" cy="140" rx="74" ry="12" fill="#F9C9D2"/>
              <path d="M121 140H269V228Q269 242 253 242H137Q121 242 121 228Z" fill="url(#gradKue)" stroke="#E9C9B6" stroke-width="1.5"/>
              <path d="M121 140H269V228Q269 242 253 242H137Q121 242 121 228Z" fill="url(#gradSisi)"/>
              <ellipse cx="195" cy="140" rx="74" ry="12" fill="#F9C9D2"/>
              <g fill="#F9C9D2">
                <rect x="125" y="138" width="10" height="20" rx="5"/>
                <rect x="137" y="138" width="10" height="13" rx="5"/>
                <rect x="149" y="138" width="10" height="26" rx="5"/>
                <rect x="161" y="138" width="10" height="17" rx="5"/>
                <rect x="173" y="138" width="10" height="23" rx="5"/>
                <rect x="185" y="138" width="10" height="15" rx="5"/>
                <rect x="197" y="138" width="10" height="25" rx="5"/>
                <rect x="209" y="138" width="10" height="18" rx="5"/>
                <rect x="221" y="138" width="10" height="28" rx="5"/>
                <rect x="233" y="138" width="10" height="16" rx="5"/>
                <rect x="245" y="138" width="10" height="21" rx="5"/>
              </g>
              <ellipse cx="171" cy="134" rx="30" ry="5" fill="#FFF6EC" opacity=".55"/>
              <path d="M137 226H253" fill="none" stroke="#FFFDF8" stroke-width="7" stroke-dasharray="0.1 14" stroke-linecap="round"/>
              <g fill="#E8B86D">
                <rect x="147" y="196" width="6" height="3" rx="1.5" transform="rotate(18 150 197)"/>
                <rect x="237" y="198" width="6" height="3" rx="1.5" transform="rotate(-22 240 199)"/>
              </g>
              <g fill="#FFF9F0">
                <circle cx="133" cy="238" r="6"/><circle cx="147" cy="240" r="5.5"/><circle cx="161" cy="238" r="6"/>
                <circle cx="175" cy="240" r="5.5"/><circle cx="189" cy="238" r="6"/><circle cx="203" cy="240" r="5.5"/>
                <circle cx="217" cy="238" r="6"/><circle cx="231" cy="240" r="5.5"/><circle cx="245" cy="238" r="6"/>
                <circle cx="257" cy="240" r="5.5"/>
              </g>
              <g transform="translate(131 132)">
                <path d="M0 -8c7-4 12 2 10 8-2 8-7 13-10 15-3-2-8-7-10-15-2-6 3-12 10-8Z" fill="url(#gradStroberi)"/>
                <path d="M-8-8c2-5 6-7 8-7s6 2 8 7c-3 2-5 2-8 2s-5 0-8-2Z" fill="#9CB89A"/>
                <g fill="#FFF6EC" opacity=".85">
                  <circle cx="-3" cy="0" r="1"/>
                  <circle cx="3" cy="3" r="1"/>
                  <circle cx="0" cy="8" r="1"/>
                </g>
              </g>
              <g transform="translate(255 134)">
                <path d="M0 -8c7-4 12 2 10 8-2 8-7 13-10 15-3-2-8-7-10-15-2-6 3-12 10-8Z" fill="url(#gradStroberi)"/>
                <path d="M-8-8c2-5 6-7 8-7s6 2 8 7c-3 2-5 2-8 2s-5 0-8-2Z" fill="#9CB89A"/>
                <g fill="#FFF6EC" opacity=".85">
                  <circle cx="-3" cy="0" r="1"/>
                  <circle cx="3" cy="3" r="1"/>
                  <circle cx="0" cy="8" r="1"/>
                </g>
              </g>
            </g>

            <!-- Bekas potongan: interior kue di tepi kanan yang terpotong -->
            <g id="kue-bekas-bawah" class="kue__bekas" hidden>
              <rect x="327" y="330" width="8" height="106" fill="url(#gradBekas)"/>
              <rect x="327" y="356" width="8" height="6" fill="#FFF7EC" opacity=".9"/>
              <rect x="327" y="382" width="8" height="5" fill="#FFF7EC" opacity=".75"/>
              <rect x="327" y="408" width="8" height="4" fill="#F4B6C2" opacity=".55"/>
            </g>
            <g id="kue-bekas-tengah" class="kue__bekas" hidden>
              <rect x="294" y="232" width="8" height="106" fill="url(#gradBekas)"/>
              <rect x="294" y="262" width="8" height="6" fill="#FFF7EC" opacity=".9"/>
              <rect x="294" y="292" width="8" height="5" fill="#FFF7EC" opacity=".75"/>
              <rect x="294" y="318" width="8" height="4" fill="#F4B6C2" opacity=".55"/>
            </g>
            <g id="kue-bekas-atas" class="kue__bekas" hidden>
              <rect x="261" y="140" width="8" height="102" fill="url(#gradBekas)"/>
              <rect x="261" y="172" width="8" height="6" fill="#FFF7EC" opacity=".9"/>
              <rect x="261" y="198" width="8" height="5" fill="#FFF7EC" opacity=".75"/>
              <rect x="261" y="222" width="8" height="4" fill="#F4B6C2" opacity=".55"/>
            </g>
            </g><!-- /kue-geser -->

    <div id="waBar" class="wa" hidden>
      <a id="waTombol" class="wa__tombol" target="_blank" rel="noopener noreferrer"></a>
      <p id="footerTeks" class="wa__teks tulisan-tangan"></p>
    </div>
  </footer>

  <!-- Lightbox galeri (F5): Esc dan backdrop menutup lewat <dialog> -->
  <dialog id="lightbox" class="lightbox" aria-label="Foto kenangan">
    <div class="lightbox__kartu">
      <img id="lightboxImg" class="lightbox__img" alt="">
      <div class="lightbox__caption">
        <p id="lightboxTeks" class="lightbox__teks"></p>
        <p id="lightboxTanggal" class="lightbox__tanggal"></p>
      </div>
      <button id="lightboxTutup" class="lightbox__tombol lightbox__tombol--tutup" type="button" aria-label="Tutup foto">✕</button>
      <button id="lightboxSebelum" class="lightbox__tombol lightbox__tombol--kiri" type="button" aria-label="Foto sebelumnya">‹</button>
      <button id="lightboxSesudah" class="lightbox__tombol lightbox__tombol--kanan" type="button" aria-label="Foto berikutnya">›</button>
    </div>
  </dialog>

  <!-- Modal surat cinta (F9). Teks dan tombol diisi dari data.js oleh script.js. -->
  <dialog id="suratModal" class="surat-modal" aria-label="Surat cinta">
    <div class="surat-modal__kertas" id="suratKertas" tabindex="-1">
      <!-- Bunga tekan di sudut kertas -->
      <svg class="surat-modal__bunga" viewBox="0 0 80 110" aria-hidden="true" focusable="false">
        <path d="M38 108C40 84 38 62 44 36" fill="none" stroke="#B08A72" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="36" cy="86" rx="12" ry="4.5" fill="#CDB4DB" opacity=".85" transform="rotate(24 36 86)"/>
        <ellipse cx="49" cy="70" rx="10" ry="4" fill="#CDB4DB" opacity=".8" transform="rotate(-28 49 70)"/>
        <g fill="#EBC3CE" opacity=".9">
          <circle cx="44" cy="20" r="7"/>
          <circle cx="53" cy="27" r="7"/>
          <circle cx="50" cy="38" r="7"/>
          <circle cx="38" cy="38" r="7"/>
          <circle cx="35" cy="27" r="7"/>
        </g>
        <circle cx="44" cy="29" r="5" fill="#E8B86D"/>
      </svg>
      <p class="surat-modal__teks"><span id="suratIsi"></span><span id="suratKursor" class="surat-modal__kursor" aria-hidden="true"></span></p>
      <div class="surat-modal__aksi">
        <button id="suratLewati" class="surat-modal__lewati" type="button"></button>
        <button id="suratTutup" class="btn surat-modal__tutup" type="button"></button>
      </div>
    </div>
  </dialog>

  <!-- Modal lampion harapan (F10): tulis harapan atau baca harapan dari data.js. -->
  <dialog id="lampionModal" class="lampion-modal" aria-label="Lampion harapan">
    <div class="lampion-modal__kertas">
      <p id="lampionModalIsi" class="lampion-modal__isi tulisan-tangan" hidden></p>
      <form id="formLampion" class="lampion-modal__form" novalidate>
        <textarea id="harapanInput" class="lampion-modal__input" rows="3" maxlength="120" autocomplete="off"></textarea>
        <p id="harapanHitung" class="lampion-modal__hitung" aria-hidden="true">0/120</p>
        <p id="pesanLampion" class="lampion-modal__pesan" role="status" aria-live="polite"></p>
        <button id="lampionLepas" class="btn btn--besar" type="submit"></button>
      </form>
      <button id="lampionTutup" class="lampion-modal__tutup" type="button"></button>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
